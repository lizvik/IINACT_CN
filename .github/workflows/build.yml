name: IINACT_CN build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: '0.0.0.0'
      DALAMUD_HOME: /tmp/dalamud
      DOTNET_NOLOGO: true
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Download Dalamud
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip /tmp/dalamud
    - name: Build
      run: dotnet build -c release
    - name: Prepare Build Artifact
      shell: pwsh
      run: |
        Copy-Item "IINACT_CN/bin/Release/win-x64/IINACT_CN/latest.zip" -Destination "IINACT_CN.zip"
        Expand-Archive -Force IINACT_CN.zip Artifact
    - name: Upload IINACT_CN
      uses: actions/upload-artifact@v4
      with:
        name: IINACT_CN
        path: Artifact/*
    - name: Update repo.json if needed
      shell: pwsh
      run: |
        $repo = Get-Content 'repo.json' -raw | ConvertFrom-Json
        $build = Get-Content 'IINACT_CN/bin/Release/win-x64/IINACT_CN/IINACT_CN.json' -raw | ConvertFrom-Json
        if ($repo.AssemblyVersion -eq $build.AssemblyVersion) {
          Exit
        }
        Write-Output "RELEASE_VERSION=$($build.AssemblyVersion)" >> $env:GITHUB_ENV
        $repo.AssemblyVersion = $repo.TestingAssemblyVersion = $build.AssemblyVersion
        $repo.DownloadLinkInstall = 'https://github.com/tinnate/IINACT_CN/releases/download/v' + $repo.AssemblyVersion + '/IINACT_CN.zip'
        $repo.DownloadLinkTesting =  'https://github.com/tinnate/IINACT_CN/releases/download/v' + $repo.TestingAssemblyVersion + '/IINACT_CN.zip'
        $repo.DownloadLinkUpdate = $repo.DownloadLinkInstall
        $repo | ConvertTo-Json | % { "[`n" + $_ + "`n]" } | Set-Content 'repo.json'
    - name: Create Release
      if: ${{ env.RELEASE_VERSION != '0.0.0.0' }}
      uses: softprops/action-gh-release@v1
      with:
        files: IINACT_CN.zip
        name: IINACT_CN ${{ env.RELEASE_VERSION }}
        tag_name: v${{ env.RELEASE_VERSION }}
        prerelease: false
        append_body: true
        body_path: .github/release-notices.md
        generate_release_notes: true
        fail_on_unmatched_files: true
    - name: Commit repo.json
      if: ${{ env.RELEASE_VERSION != '0.0.0.0' }}
      run: |
        git config --global user.name "Actions User"
        git config --global user.email "actions@github.com"
        git fetch origin main
        git checkout main
        git add repo.json
        git commit -m "[CI] updating repo.json for ${{ env.RELEASE_VERSION }}" || true
        git push origin main   
    
    

